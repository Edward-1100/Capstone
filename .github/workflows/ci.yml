name: CI

#Checks on pushes to main and on pull request
on:
  push:
    branches: [main]
  pull_request:

jobs:
  #check backend
  backend:
    runs-on: ubuntu-latest
    defaults:
      #run commands in backend
      run:
        working-directory: backend
    steps:
      #Download repo, then install node
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e

  #check frontend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      #run commands in frontend
      run:
        working-directory: frontend
    steps:
      #Download repo, then install node
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
